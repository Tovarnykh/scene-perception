[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-perception-yolo11-midas"
version = "0.1.0"
description = "Scene perception prototype using YOLO11 detection and MiDaS depth estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "torch",
    "torchvision",
    "opencv-python",
    "numpy",
    "matplotlib",
    "pillow",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
scene-perception = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
